; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1 
framework = arduino
; upload_port = Tap-o-meter_3.local\
upload_port = /dev/cu.wchusbserial58B90444461
monitor_speed = 115200
lib_compat_mode = strict
monitor_filters = esp32_exception_decoder,send_on_enter
monitor_eol     = CRLF  
monitor_echo    = yes  
monitor_port = /dev/cu.wchusbserial58B90444461
lib_deps = 
	links2004/WebSockets@2.3.7
	bblanchon/ArduinoJson@6.20.0
	mathieucarbou/MycilaWebSerial@^7.0.1

